# 部署主站（纯静态 HTML）到 GitHub Pages
# 触发：push 到 main 分支，或在 Actions 标签页手动运行
name: Deploy static site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# 赋予 GITHUB_TOKEN 部署 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，且不取消正在进行的生产部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 仓库根目录即为站点内容（index.html / assets / sitemaps 等）
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
